# Redis Configuration for FinTech Demo

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
maxmemory 128mb
maxmemory-policy allkeys-lru

# Persistence (disable for demo, faster restarts)
save ""
appendonly no

# Logging
loglevel notice
logfile ""

# Connection limits (intentionally low for demo scenarios)
maxclients 150
timeout 30

# TCP keepalive
tcp-keepalive 300

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
