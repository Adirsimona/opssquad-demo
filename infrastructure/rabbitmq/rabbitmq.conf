# RabbitMQ Configuration for FinTech Demo

# Default user (set via environment variables, this is backup)
default_user = fintech
default_pass = fintech123

# Memory limits (intentionally constrained for demo)
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.5

# Disk limits
disk_free_limit.relative = 1.0

# Network
listeners.tcp.default = 5672
management.tcp.port = 15672

# Queue limits
queue_master_locator = min-masters

# Consumer timeout (disabled for demo)
consumer_timeout = 1800000

# Logging
log.console = true
log.console.level = info
