# Prometheus Configuration for FinTech Demo

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:80']
    metrics_path: '/metrics'

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'

  - job_name: 'account-service'
    static_configs:
      - targets: ['account-service:3002']
    metrics_path: '/metrics'

  - job_name: 'transaction-service'
    static_configs:
      - targets: ['transaction-service:3003']
    metrics_path: '/metrics'

  - job_name: 'fraud-detection'
    static_configs:
      - targets: ['fraud-detection:3004']
    metrics_path: '/metrics'

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3005']
    metrics_path: '/metrics'

  - job_name: 'payment-processor'
    static_configs:
      - targets: ['payment-processor:3006']
    metrics_path: '/metrics'
